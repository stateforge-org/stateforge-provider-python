[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"


[project]
name = "stateforge-provider"
version = "0.1.0"
description = "StateForge Provider framework and runtime for Python"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]

authors = [
    { name = "StateForge" },
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    "grpcio>=1.83",
    "jsonschema>=4.25,<5",
    "pydantic>=2.12,<3",
    "referencing>=0.36,<1",
    "rfc8785>=0.1.4,<1",
    "stateforge-protocol>=0.1.0,<0.2.0",
]


[project.urls]
Homepage = "https://github.com/stateforge-org/stateforge-provider-python"
Documentation = "https://github.com/stateforge-org/stateforge-provider-python/tree/main/docs"
Repository = "https://github.com/stateforge-org/stateforge-provider-python"
Issues = "https://github.com/stateforge-org/stateforge-provider-python/issues"


[dependency-groups]
dev = [
    "build>=1.2",
    "mypy>=1.17",
    "pytest>=8.4",
    "pytest-asyncio>=1",
    "pytest-cov>=6.2",
    "ruff>=0.12",
    "types-grpcio",
    "types-jsonschema",
    "types-protobuf",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6,<10",
    "mkdocstrings[python]>=0.30,<1",
]


[tool.hatch.build.targets.wheel]
packages = ["src/stateforge_provider"]


[tool.hatch.build.targets.sdist]
exclude = [
    "/.agents",
    "/.chronos",
    "/.claude",
    "/AGENTS.md",
    "/CLAUDE.md",
    "/STATEFORGE_DPT.md",
]


[tool.ruff]
target-version = "py311"
line-length = 79
src = ["src", "tests"]


[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "ASYNC",
    "B",
    "C4",
    "D",
    "E",
    "F",
    "I",
    "N",
    "PERF",
    "PIE",
    "PL",
    "RUF",
    "S",
    "SIM",
    "T20",
    "UP",
    "W",
]

ignore = [
    "ANN401",
    "PLR0913",
    "W191",
    "E111",
    "E114",
    "E117",
    "D203",
    "D206",
    "D300",
]


[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "D", "S101"]


[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "auto"
docstring-code-format = true


[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["stateforge_provider"]
pretty = true
show_error_codes = true
warn_unreachable = true
warn_unused_configs = true


[tool.pytest.ini_options]
minversion = "8.4"
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=stateforge_provider",
    "--cov-report=term-missing",
]
testpaths = ["tests"]
asyncio_mode = "strict"


[tool.coverage.run]
branch = true
source = ["stateforge_provider"]


[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
