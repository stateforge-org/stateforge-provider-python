name: Crash an installed StateForge Provider
description: Kill one fixture and preserve its stale endpoint evidence.

inputs:
  container-name:
    description: Fedora container running the Provider.
    required: true
  unit-name:
    description: Transient systemd unit returned by the start action.
    required: true
  descriptor-path:
    description: Stable descriptor path observed before the crash.
    required: true
  socket-path:
    description: Generation-specific socket path observed before the crash.
    required: true
  evidence-directory:
    description: Host directory receiving deterministic fault evidence.
    required: true
  timeout-seconds:
    description: Maximum time to wait for process termination.
    required: false
    default: "30"

runs:
  using: composite
  steps:
    - name: Terminate fixture without graceful cleanup
      shell: bash
      env:
        CONTAINER_NAME: ${{ inputs.container-name }}
        DESCRIPTOR_PATH: ${{ inputs.descriptor-path }}
        EVIDENCE_DIRECTORY: ${{ inputs.evidence-directory }}
        SOCKET_PATH: ${{ inputs.socket-path }}
        TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
        UNIT_NAME: ${{ inputs.unit-name }}
      run: |
        set -euo pipefail
        mkdir -p "${EVIDENCE_DIRECTORY}"
        docker exec "${CONTAINER_NAME}" \
          systemctl kill --kill-whom=main --signal=KILL "${UNIT_NAME}"
        deadline=$((SECONDS + TIMEOUT_SECONDS))
        while (( SECONDS < deadline )); do
          state="$(docker exec "${CONTAINER_NAME}" \
            systemctl is-active "${UNIT_NAME}" 2>/dev/null || true)"
          if [[ "${state}" == "failed" || "${state}" == "inactive" ]]; then
            break
          fi
          sleep 1
        done
        if [[ "${state:-}" != "failed" && "${state:-}" != "inactive" ]]; then
          echo "Provider process survived SIGKILL" >&2
          exit 1
        fi
        docker exec "${CONTAINER_NAME}" test -f "${DESCRIPTOR_PATH}"
        docker exec "${CONTAINER_NAME}" test -S "${SOCKET_PATH}"
        printf '%s\n' \
          "unit=${UNIT_NAME}" \
          "descriptor=${DESCRIPTOR_PATH}" \
          "socket=${SOCKET_PATH}" \
          > "${EVIDENCE_DIRECTORY}/crash.txt"
