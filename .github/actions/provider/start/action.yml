name: Start an installed StateForge Provider
description: Run a public-API fixture beside the installed Agent in Fedora.

inputs:
  container-name:
    description: Fedora container running the installed Agent.
    required: true
  fixture-path:
    description: Staged Provider fixture entry point.
    required: true
  instance-name:
    description: Safe name used for the fixture process and service.
    required: true
  state-name:
    description: Stable state name; reuse it to preserve installation identity.
    required: true
  identity:
    description: Author-declared Provider identity.
    required: true
  display-name:
    description: Author-declared Provider display name.
    required: false
    default: StateForge CI Provider
  evidence-directory:
    description: Host directory receiving process and descriptor evidence.
    required: true
  timeout-seconds:
    description: Maximum time to wait for endpoint publication.
    required: false
    default: "60"
  capability-boundaries:
    description: Enable Capability cancellation and message-limit fixtures.
    required: false
    default: "false"
  trigger-publication:
    description: Enable the dedicated Trigger Publication fixture controls.
    required: false
    default: "false"
  drop-trigger-acks-until-marker:
    description: Discard terminal trigger ACKs until the state marker exists.
    required: false
    default: "false"
  first-trigger-publication-id:
    description: Deterministic UUIDv4 for the first fixture publication.
    required: false
    default: ""
  trigger-startup-sequence:
    description: Payload sequence emitted by the decorated startup source.
    required: false
    default: "1"

outputs:
  unit-name:
    description: Transient systemd unit running the Provider.
    value: ${{ steps.start.outputs.unit-name }}
  descriptor-path:
    description: Descriptor path inside the Fedora system.
    value: ${{ steps.start.outputs.descriptor-path }}
  provider-instance-id:
    description: Stable Provider installation identity.
    value: ${{ steps.start.outputs.provider-instance-id }}
  endpoint-generation:
    description: Allocated endpoint generation.
    value: ${{ steps.start.outputs.endpoint-generation }}
  socket-path:
    description: Generation-specific Unix socket inside Fedora.
    value: ${{ steps.start.outputs.socket-path }}
  event-log:
    description: Lifecycle event log inside Fedora.
    value: ${{ steps.start.outputs.event-log }}
  service-invocation-id:
    description: systemd invocation that published this endpoint.
    value: ${{ steps.start.outputs.service-invocation-id }}
  state-directory:
    description: Stable Provider installation state inside Fedora.
    value: ${{ steps.start.outputs.state-directory }}
  target-path:
    description: Scenario target inspected by requirement checks.
    value: ${{ steps.start.outputs.target-path }}

runs:
  using: composite
  steps:
    - name: Start fixture and wait for endpoint publication
      id: start
      shell: bash
      env:
        CONTAINER_NAME: ${{ inputs.container-name }}
        CAPABILITY_BOUNDARIES: ${{ inputs.capability-boundaries }}
        DROP_TRIGGER_ACKS: ${{ inputs.drop-trigger-acks-until-marker }}
        DISPLAY_NAME: ${{ inputs.display-name }}
        EVIDENCE_DIRECTORY: ${{ inputs.evidence-directory }}
        FIXTURE_PATH: ${{ inputs.fixture-path }}
        IDENTITY: ${{ inputs.identity }}
        INSTANCE_NAME: ${{ inputs.instance-name }}
        FIRST_TRIGGER_PUBLICATION_ID: ${{ inputs.first-trigger-publication-id }}
        STATE_NAME: ${{ inputs.state-name }}
        TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
        TRIGGER_PUBLICATION: ${{ inputs.trigger-publication }}
        TRIGGER_STARTUP_SEQUENCE: ${{ inputs.trigger-startup-sequence }}
      run: |
        set -euo pipefail
        if [[ ! "${INSTANCE_NAME}" =~ ^[a-z][a-z0-9-]{0,20}$ || \
              ! "${STATE_NAME}" =~ ^[a-z][a-z0-9-]{0,20}$ ]]; then
          echo "Provider fixture and state names must be safe identifiers" >&2
          exit 2
        fi
        mkdir -p "${EVIDENCE_DIRECTORY}"

        fixture_root="/opt/stateforge-provider-tests/${INSTANCE_NAME}"
        state_directory="/var/lib/stateforge-provider-tests/${STATE_NAME}"
        log_directory="/var/log/stateforge-provider-tests/${INSTANCE_NAME}"
        event_log="${log_directory}/events.log"
        target_path="${state_directory}/target-state.txt"
        service_user="sf-${STATE_NAME}"
        unit_name="stateforge-test-${INSTANCE_NAME}.service"

        docker exec "${CONTAINER_NAME}" mkdir -p \
          "${fixture_root}" "${state_directory}" "${log_directory}"
        docker cp "${FIXTURE_PATH}" \
          "${CONTAINER_NAME}:${fixture_root}/provider.py"
        if ! docker exec "${CONTAINER_NAME}" test -f "${target_path}"; then
          docker exec "${CONTAINER_NAME}" bash -c \
            "printf '%s\\n' 'fixture-target-state' > '${target_path}'"
        fi
        if ! docker exec "${CONTAINER_NAME}" id "${service_user}" \
          >/dev/null 2>&1; then
          docker exec "${CONTAINER_NAME}" \
            useradd --system --no-create-home \
              --groups stateforge-providers "${service_user}"
        fi
        docker exec "${CONTAINER_NAME}" chown -R \
          "${service_user}:${service_user}" \
          "${state_directory}" "${log_directory}"
        docker exec "${CONTAINER_NAME}" chmod 0700 "${state_directory}"
        docker exec "${CONTAINER_NAME}" chmod -R a+rX "${fixture_root}"

        identity_path="${state_directory}/identity.json"
        previous_generation=0
        if docker exec "${CONTAINER_NAME}" test -f "${identity_path}"; then
          provider_id="$(docker exec "${CONTAINER_NAME}" \
            jq -r .provider_instance_id "${identity_path}")"
          descriptor="/run/stateforge-agent/providers/${provider_id}.sfp.json"
          if docker exec "${CONTAINER_NAME}" test -f "${descriptor}"; then
            previous_generation="$(docker exec "${CONTAINER_NAME}" \
              jq -r '.endpoint_generation // 0' "${descriptor}")"
          fi
        fi

        capability_arguments=()
        case "${CAPABILITY_BOUNDARIES}" in
          true)
            capability_arguments+=(--capability-boundaries)
            ;;
          false)
            ;;
          *)
            echo "capability-boundaries must be true or false" >&2
            exit 2
            ;;
        esac

        trigger_arguments=()
        case "${TRIGGER_PUBLICATION}" in
          true)
            if [[ "${DROP_TRIGGER_ACKS}" != "true" \
              && "${DROP_TRIGGER_ACKS}" != "false" ]]; then
              echo "drop-trigger-acks-until-marker must be true or false" >&2
              exit 2
            fi
            if [[ -n "${FIRST_TRIGGER_PUBLICATION_ID}" \
              && ! "${FIRST_TRIGGER_PUBLICATION_ID}" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]; then
              echo "first-trigger-publication-id must be a lowercase UUIDv4" >&2
              exit 2
            fi
            if [[ ! "${TRIGGER_STARTUP_SEQUENCE}" =~ ^[1-9][0-9]*$ ]]; then
              echo "trigger-startup-sequence must be positive" >&2
              exit 2
            fi
            trigger_arguments+=(
              --trigger-publication
              --trigger-startup-sequence "${TRIGGER_STARTUP_SEQUENCE}"
            )
            if [[ "${DROP_TRIGGER_ACKS}" == "true" ]]; then
              trigger_arguments+=(--drop-trigger-acks-until-marker)
              docker exec "${CONTAINER_NAME}" rm -f \
                "${state_directory}/accept-trigger-acks"
            fi
            if [[ -n "${FIRST_TRIGGER_PUBLICATION_ID}" ]]; then
              trigger_arguments+=(
                --first-trigger-publication-id \
                "${FIRST_TRIGGER_PUBLICATION_ID}"
              )
            fi
            ;;
          false)
            ;;
          *)
            echo "trigger-publication must be true or false" >&2
            exit 2
            ;;
        esac

        docker exec "${CONTAINER_NAME}" systemd-run \
          --unit "${unit_name}" \
          --property "User=${service_user}" \
          --property "Group=${service_user}" \
          --property "SupplementaryGroups=stateforge-providers" \
          --property "WorkingDirectory=${fixture_root}" \
          /usr/bin/python3 "${fixture_root}/provider.py" \
          --identity "${IDENTITY}" \
          --display-name "${DISPLAY_NAME}" \
          --discovery-directory /run/stateforge-agent/providers \
          --state-directory "${state_directory}" \
          --event-log "${event_log}" \
          --target-path "${target_path}" \
          "${capability_arguments[@]}" \
          "${trigger_arguments[@]}"

        deadline=$((SECONDS + TIMEOUT_SECONDS))
        while (( SECONDS < deadline )); do
          if docker exec "${CONTAINER_NAME}" test -f "${identity_path}"; then
            provider_id="$(docker exec "${CONTAINER_NAME}" \
              jq -r .provider_instance_id "${identity_path}")"
            descriptor="/run/stateforge-agent/providers/${provider_id}.sfp.json"
            if docker exec "${CONTAINER_NAME}" test -f "${descriptor}"; then
              generation="$(docker exec "${CONTAINER_NAME}" \
                jq -r '.endpoint_generation // 0' "${descriptor}")"
              if [[ "${generation}" =~ ^[0-9]+$ ]] && \
                 (( generation > previous_generation )); then
                break
              fi
            fi
          fi
          if ! docker exec "${CONTAINER_NAME}" \
            systemctl is-active --quiet "${unit_name}"; then
            break
          fi
          sleep 1
        done
        if [[ -z "${descriptor:-}" || ! "${generation:-}" =~ ^[0-9]+$ ]] || \
           (( generation <= previous_generation )) || \
           ! docker exec "${CONTAINER_NAME}" test -f "${descriptor}"; then
          docker exec "${CONTAINER_NAME}" \
            journalctl -u "${unit_name}" --no-pager || true
          echo "Provider did not publish its endpoint" >&2
          exit 1
        fi

        socket_path="$(docker exec "${CONTAINER_NAME}" \
          jq -r .transport.socket_path "${descriptor}")"
        invocation_id="$(docker exec "${CONTAINER_NAME}" \
          systemctl show "${unit_name}" \
            --property InvocationID --value)"
        main_pid="$(docker exec "${CONTAINER_NAME}" \
          systemctl show "${unit_name}" --property MainPID --value)"
        if [[ ! "${invocation_id}" =~ ^[0-9a-f]{32}$ \
          || ! "${main_pid}" =~ ^[1-9][0-9]*$ ]]; then
          echo "Provider service identity is incomplete" >&2
          exit 1
        fi
        docker exec "${CONTAINER_NAME}" test -S "${socket_path}"
        docker exec "${CONTAINER_NAME}" cat "${descriptor}" \
          > "${EVIDENCE_DIRECTORY}/descriptor.json"
        printf '%s\n' \
          "unit-name=${unit_name}" \
          "service-invocation-id=${invocation_id}" \
          "main-pid=${main_pid}" \
          "provider-instance-id=${provider_id}" \
          "endpoint-generation=${generation}" \
          "socket-path=${socket_path}" \
          > "${EVIDENCE_DIRECTORY}/process-identity.txt"
        {
          echo "unit-name=${unit_name}"
          echo "descriptor-path=${descriptor}"
          echo "provider-instance-id=${provider_id}"
          echo "endpoint-generation=${generation}"
          echo "socket-path=${socket_path}"
          echo "event-log=${event_log}"
          echo "service-invocation-id=${invocation_id}"
          echo "state-directory=${state_directory}"
          echo "target-path=${target_path}"
        } >> "${GITHUB_OUTPUT}"
