name: Start an installed StateForge Provider
description: Start a staged public-API fixture and wait for its descriptor.

inputs:
  python:
    description: Python interpreter containing the installed Provider package.
    required: true
  fixture-path:
    description: Staged Provider fixture entry point.
    required: true
  identity:
    description: Author-declared Provider identity.
    required: true
  display-name:
    description: Author-declared Provider display name.
    required: false
    default: StateForge CI Provider
  discovery-directory:
    description: Shared discovery directory.
    required: true
  state-directory:
    description: Persistent state directory for this Provider identity.
    required: true
  event-log:
    description: Lifecycle event log written by the fixture.
    required: true
  evidence-directory:
    description: Directory receiving process and descriptor evidence.
    required: true
  timeout-seconds:
    description: Maximum time to wait for publication.
    required: false
    default: "15"

outputs:
  pid:
    description: Fixture process ID.
    value: ${{ steps.start.outputs.pid }}
  descriptor-path:
    description: Published endpoint descriptor path.
    value: ${{ steps.start.outputs.descriptor-path }}
  provider-instance-id:
    description: Stable installation identity.
    value: ${{ steps.start.outputs.provider-instance-id }}
  endpoint-generation:
    description: Allocated endpoint generation.
    value: ${{ steps.start.outputs.endpoint-generation }}
  socket-path:
    description: Generation-specific Unix socket.
    value: ${{ steps.start.outputs.socket-path }}

runs:
  using: composite
  steps:
    - name: Start fixture and wait for endpoint publication
      id: start
      shell: bash
      env:
        DISCOVERY_DIRECTORY: ${{ inputs.discovery-directory }}
        DISPLAY_NAME: ${{ inputs.display-name }}
        EVENT_LOG: ${{ inputs.event-log }}
        EVIDENCE_DIRECTORY: ${{ inputs.evidence-directory }}
        FIXTURE_PATH: ${{ inputs.fixture-path }}
        IDENTITY: ${{ inputs.identity }}
        ISOLATED_PYTHON: ${{ inputs.python }}
        STATE_DIRECTORY: ${{ inputs.state-directory }}
        TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
      run: |
        set -euo pipefail
        if [[ ! "${TIMEOUT_SECONDS}" =~ ^[0-9]+$ ]] || (( TIMEOUT_SECONDS < 1 )); then
          echo "timeout-seconds must be a positive integer" >&2
          exit 1
        fi
        mkdir -p "${EVIDENCE_DIRECTORY}"
        log="${EVIDENCE_DIRECTORY}/provider.log"
        previous_generation=0
        if [[ -f "${STATE_DIRECTORY}/identity.json" ]]; then
          previous_generation="$(jq -r '.last_endpoint_generation // 0' \
            "${STATE_DIRECTORY}/identity.json")"
          if [[ ! "${previous_generation}" =~ ^[0-9]+$ ]]; then
            echo "Existing endpoint generation is invalid" >&2
            exit 1
          fi
        fi
        nohup env -u PYTHONPATH -u PYTHONHOME \
          "${ISOLATED_PYTHON}" -I "${FIXTURE_PATH}" \
          --identity "${IDENTITY}" \
          --display-name "${DISPLAY_NAME}" \
          --discovery-directory "${DISCOVERY_DIRECTORY}" \
          --state-directory "${STATE_DIRECTORY}" \
          --event-log "${EVENT_LOG}" \
          > "${log}" 2>&1 &
        pid=$!
        printf '%s\n' "${pid}" > "${EVIDENCE_DIRECTORY}/provider.pid"

        deadline=$((SECONDS + TIMEOUT_SECONDS))
        descriptor=""
        while (( SECONDS < deadline )); do
          if ! kill -0 "${pid}" 2>/dev/null; then
            cat "${log}" >&2
            echo "Provider exited before publishing its descriptor" >&2
            exit 1
          fi
          if [[ -f "${STATE_DIRECTORY}/identity.json" ]]; then
            provider_id="$(jq -r '.provider_instance_id' \
              "${STATE_DIRECTORY}/identity.json")"
            descriptor="${DISCOVERY_DIRECTORY}/${provider_id}.sfp.json"
            if [[ -f "${descriptor}" ]]; then
              generation="$(jq -r '.endpoint_generation // 0' \
                "${descriptor}")"
              if [[ "${generation}" =~ ^[0-9]+$ ]] && \
                 (( generation > previous_generation )); then
                break
              fi
            fi
          fi
          sleep 0.1
        done
        if [[ -z "${descriptor}" || ! -f "${descriptor}" ]]; then
          cat "${log}" >&2
          echo "Provider did not publish within ${TIMEOUT_SECONDS}s" >&2
          exit 1
        fi

        generation="$(jq -r '.endpoint_generation' "${descriptor}")"
        socket_path="$(jq -r '.transport.socket_path' "${descriptor}")"
        if [[ ! -S "${socket_path}" ]]; then
          echo "Published Provider socket is not available" >&2
          exit 1
        fi
        cp "${descriptor}" "${EVIDENCE_DIRECTORY}/descriptor.json"
        {
          echo "pid=${pid}"
          echo "descriptor-path=${descriptor}"
          echo "provider-instance-id=${provider_id}"
          echo "endpoint-generation=${generation}"
          echo "socket-path=${socket_path}"
        } >> "${GITHUB_OUTPUT}"
