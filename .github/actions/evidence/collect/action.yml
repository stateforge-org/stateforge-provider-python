name: Collect bounded installed-runtime evidence
description: Capture Agent and Provider state, then remove the Fedora system.

inputs:
  stage:
    description: Stable scenario name.
    required: true
  container-name:
    description: Fedora container owning this scenario.
    required: true
  runtime-directory:
    description: Scenario-owned host directory below the runner temp directory.
    required: true
  evidence-directory:
    description: Host directory containing and receiving scenario evidence.
    required: true
  max-file-bytes:
    description: Maximum retained size of an individual evidence file.
    required: false
    default: "262144"

runs:
  using: composite
  steps:
    - name: Preserve evidence and clean scenario state
      shell: bash
      env:
        CONTAINER_NAME: ${{ inputs.container-name }}
        EVIDENCE_DIRECTORY: ${{ inputs.evidence-directory }}
        EVIDENCE_STAGE: ${{ inputs.stage }}
        MAX_FILE_BYTES: ${{ inputs.max-file-bytes }}
        RUNTIME_DIRECTORY: ${{ inputs.runtime-directory }}
      run: |
        set -euo pipefail
        if [[ ! "${MAX_FILE_BYTES}" =~ ^[0-9]+$ ]] || \
           (( MAX_FILE_BYTES < 1024 )); then
          echo "max-file-bytes must be an integer of at least 1024" >&2
          exit 1
        fi
        case "${RUNTIME_DIRECTORY}" in
          "${RUNNER_TEMP}"/*) ;;
          *)
            echo "runtime-directory must be below RUNNER_TEMP" >&2
            exit 1
            ;;
        esac

        mkdir -p "${EVIDENCE_DIRECTORY}"
        printf '%s\n' \
          "stage=${EVIDENCE_STAGE}" \
          "repository=${GITHUB_REPOSITORY:-local}" \
          "ref=${GITHUB_REF:-local}" \
          "sha=${GITHUB_SHA:-local}" \
          "runner-os=${RUNNER_OS:-local}" \
          "runner-arch=${RUNNER_ARCH:-unknown}" \
          > "${EVIDENCE_DIRECTORY}/runner-context.txt"

        status=0
        if docker inspect "${CONTAINER_NAME}" >/dev/null 2>&1; then
          docker inspect "${CONTAINER_NAME}" \
            > "${EVIDENCE_DIRECTORY}/container-inspect.json" 2>&1 || true
          docker logs "${CONTAINER_NAME}" \
            > "${EVIDENCE_DIRECTORY}/container.log" 2>&1 || true
          docker exec "${CONTAINER_NAME}" \
            systemctl status stateforge-agent.service --no-pager \
            > "${EVIDENCE_DIRECTORY}/agent-service-status.txt" 2>&1 || true
          docker exec "${CONTAINER_NAME}" \
            journalctl -u stateforge-agent.service --no-pager -n 500 \
            > "${EVIDENCE_DIRECTORY}/agent-journal.txt" 2>&1 || true
          docker exec "${CONTAINER_NAME}" bash -lc \
            "journalctl --no-pager -n 500 -u 'stateforge-test-*'" \
            > "${EVIDENCE_DIRECTORY}/provider-journal.txt" 2>&1 || true
          docker exec "${CONTAINER_NAME}" ps -ef \
            > "${EVIDENCE_DIRECTORY}/processes.txt" 2>&1 || true
          docker exec "${CONTAINER_NAME}" bash -lc \
            'find /run/stateforge-agent/providers -maxdepth 1 -printf "%M %u:%g %s %p\n" -type f -name "*.sfp.json" -exec cat {} \;' \
            > "${EVIDENCE_DIRECTORY}/provider-descriptors.txt" 2>&1 || true
          docker exec "${CONTAINER_NAME}" rpm -V --nodeps stateforge-agent \
            > "${EVIDENCE_DIRECTORY}/agent-rpm-final-verify.txt" 2>&1 || true

          docker exec "${CONTAINER_NAME}" \
            systemctl stop 'stateforge-test-*' stateforge-agent.service \
            > "${EVIDENCE_DIRECTORY}/service-stop.txt" 2>&1 || true
          docker exec "${CONTAINER_NAME}" rpm -e stateforge-agent \
            > "${EVIDENCE_DIRECTORY}/agent-rpm-remove.txt" 2>&1 || status=$?
          docker rm --force "${CONTAINER_NAME}" >/dev/null 2>&1 || status=1
        else
          echo "Scenario container was not created" \
            > "${EVIDENCE_DIRECTORY}/container-missing.txt"
        fi

        if [[ -d "${RUNTIME_DIRECTORY}" ]]; then
          find "${RUNTIME_DIRECTORY}" -maxdepth 5 \
            -printf '%M %u:%g %s %p\n' \
            > "${EVIDENCE_DIRECTORY}/runtime-inventory.txt"
        fi
        while IFS= read -r -d '' file; do
          size="$(wc -c < "${file}")"
          if (( size > MAX_FILE_BYTES )); then
            tail -c "${MAX_FILE_BYTES}" "${file}" > "${file}.bounded"
            mv "${file}.bounded" "${file}"
          fi
        done < <(find "${EVIDENCE_DIRECTORY}" -type f -print0)

        rm -rf -- "${RUNTIME_DIRECTORY}"
        exit "${status}"
