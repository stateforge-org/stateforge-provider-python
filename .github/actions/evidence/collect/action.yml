name: Collect bounded Provider runtime evidence
description: Preserve safe scenario evidence and remove temporary runtime state.

inputs:
  stage:
    description: Stable scenario name.
    required: true
  runtime-directory:
    description: Scenario-owned directory below the runner temp directory.
    required: true
  evidence-directory:
    description: Directory containing and receiving scenario evidence.
    required: true
  max-file-bytes:
    description: Maximum retained size of an individual evidence file.
    required: false
    default: "262144"

runs:
  using: composite
  steps:
    - name: Preserve evidence and clean scenario state
      shell: bash
      env:
        EVIDENCE_DIRECTORY: ${{ inputs.evidence-directory }}
        EVIDENCE_STAGE: ${{ inputs.stage }}
        MAX_FILE_BYTES: ${{ inputs.max-file-bytes }}
        RUNTIME_DIRECTORY: ${{ inputs.runtime-directory }}
      run: |
        set -euo pipefail
        if [[ ! "${MAX_FILE_BYTES}" =~ ^[0-9]+$ ]] || \
           (( MAX_FILE_BYTES < 1024 )); then
          echo "max-file-bytes must be an integer of at least 1024" >&2
          exit 1
        fi
        case "${RUNTIME_DIRECTORY}" in
          "${RUNNER_TEMP}"/*) ;;
          *)
            echo "runtime-directory must be below RUNNER_TEMP" >&2
            exit 1
            ;;
        esac

        mkdir -p "${EVIDENCE_DIRECTORY}"
        printf '%s\n' \
          "stage=${EVIDENCE_STAGE}" \
          "repository=${GITHUB_REPOSITORY:-local}" \
          "ref=${GITHUB_REF:-local}" \
          "sha=${GITHUB_SHA:-local}" \
          "runner-os=${RUNNER_OS:-local}" \
          "runner-arch=${RUNNER_ARCH:-unknown}" \
          > "${EVIDENCE_DIRECTORY}/runner-context.txt"

        while IFS= read -r -d '' pid_file; do
          pid="$(cat "${pid_file}")"
          if [[ "${pid}" =~ ^[0-9]+$ ]] && kill -0 "${pid}" 2>/dev/null; then
            kill -TERM "${pid}" 2>/dev/null || true
            for _ in {1..30}; do
              state="$(ps -o stat= -p "${pid}" 2>/dev/null || true)"
              if [[ -z "${state}" || "${state}" == Z* ]]; then
                break
              fi
              sleep 0.1
            done
            kill -KILL "${pid}" 2>/dev/null || true
          fi
        done < <(find "${EVIDENCE_DIRECTORY}" -name provider.pid -print0)

        if [[ -d "${RUNTIME_DIRECTORY}" ]]; then
          find "${RUNTIME_DIRECTORY}" -maxdepth 5 \
            -path "${RUNTIME_DIRECTORY}/environment" -prune -o \
            -printf '%M %u:%g %s %p\n' \
            > "${EVIDENCE_DIRECTORY}/runtime-inventory.txt"
          find "${RUNTIME_DIRECTORY}" \
            -path "${RUNTIME_DIRECTORY}/environment" -prune -o -type f \
            \( -name '*.json' -o -name '*.log' -o -name '*.txt' \) \
            -print0 | while IFS= read -r -d '' file; do
              relative="${file#"${RUNTIME_DIRECTORY}"/}"
              destination="${EVIDENCE_DIRECTORY}/runtime/${relative}"
              mkdir -p "$(dirname "${destination}")"
              cp "${file}" "${destination}"
            done
        fi

        while IFS= read -r -d '' file; do
          size="$(wc -c < "${file}")"
          if (( size > MAX_FILE_BYTES )); then
            tail -c "${MAX_FILE_BYTES}" "${file}" > "${file}.bounded"
            mv "${file}.bounded" "${file}"
          fi
        done < <(find "${EVIDENCE_DIRECTORY}" -type f -print0)

        rm -rf -- "${RUNTIME_DIRECTORY}"
