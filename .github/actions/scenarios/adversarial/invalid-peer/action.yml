name: Test invalid Provider discovery data
description: Verify the real Agent rejects malformed data and accepts recovery.

inputs:
  agent-artifact-directory:
    description: Directory containing the exact Agent RPM build.
    required: true
  agent-source-directory:
    description: Exact Agent checkout providing its Fedora test image.
    required: true
  provider-artifact-directory:
    description: Directory containing the exact Provider build.
    required: true
  protocol-artifact-directory:
    description: Directory containing the exact Protocol build.
    required: true
  runtime-directory:
    description: Scenario-owned directory under the runner temp directory.
    required: true
  evidence-directory:
    description: Directory receiving scenario evidence.
    required: true

runs:
  using: composite
  steps:
    - name: Install exact runtime artifacts
      id: system
      uses: ./.github/actions/agent/install
      with:
        agent-artifact-directory: ${{ inputs.agent-artifact-directory }}
        agent-source-directory: ${{ inputs.agent-source-directory }}
        provider-artifact-directory: ${{ inputs.provider-artifact-directory }}
        protocol-artifact-directory: ${{ inputs.protocol-artifact-directory }}
        evidence-directory: ${{ inputs.evidence-directory }}/installation

    - name: Start installed Agent
      uses: ./.github/actions/agent/start
      with:
        container-name: ${{ steps.system.outputs.container-name }}

    - name: Assert invalid descriptor rejection
      uses: ./.github/actions/agent/assert-invalid-descriptor
      with:
        container-name: ${{ steps.system.outputs.container-name }}
        evidence-directory: ${{ inputs.evidence-directory }}/invalid

    - name: Create recovery Provider fixture
      id: fixture
      uses: ./.github/actions/provider/create-fixture
      with:
        runtime-directory: ${{ inputs.runtime-directory }}
        instance-name: provider-valid
        identity: stateforge.test.recovery

    - name: Start recovery Provider
      id: provider
      uses: ./.github/actions/provider/start
      with:
        container-name: ${{ steps.system.outputs.container-name }}
        fixture-path: ${{ steps.fixture.outputs.fixture-path }}
        instance-name: ${{ steps.fixture.outputs.instance-name }}
        state-name: ${{ steps.fixture.outputs.state-name }}
        identity: stateforge.test.recovery
        evidence-directory: ${{ inputs.evidence-directory }}/provider

    - name: Assert recovered Agent-accepted session
      uses: ./.github/actions/agent/assert-session
      with:
        container-name: ${{ steps.system.outputs.container-name }}
        provider-instance-id: ${{ steps.provider.outputs.provider-instance-id }}
        endpoint-generation: ${{ steps.provider.outputs.endpoint-generation }}
        evidence-directory: ${{ inputs.evidence-directory }}/agent

    - name: Stop recovery Provider
      uses: ./.github/actions/provider/stop
      with:
        container-name: ${{ steps.system.outputs.container-name }}
        unit-name: ${{ steps.provider.outputs.unit-name }}
        descriptor-path: ${{ steps.provider.outputs.descriptor-path }}
        socket-path: ${{ steps.provider.outputs.socket-path }}
        event-log: ${{ steps.provider.outputs.event-log }}
        evidence-directory: ${{ inputs.evidence-directory }}/provider

    - name: Preserve bounded evidence and clean up
      if: ${{ always() }}
      uses: ./.github/actions/evidence/collect
      with:
        stage: invalid-peer
        container-name: ${{ steps.system.outputs.container-name }}
        runtime-directory: ${{ inputs.runtime-directory }}
        evidence-directory: ${{ inputs.evidence-directory }}
