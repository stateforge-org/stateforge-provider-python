name: Test same-installation Provider replacement
description: Verify the Agent accepts a newer generation of one installation.

inputs:
  agent-artifact-directory:
    description: Directory containing the exact Agent RPM build.
    required: true
  agent-test-image-directory:
    description: Bundled exact Agent Fedora test-image definition.
    required: true
  provider-artifact-directory:
    description: Directory containing the exact Provider build.
    required: true
  protocol-artifact-directory:
    description: Directory containing the exact Protocol build.
    required: true
  runtime-directory:
    description: Scenario-owned directory under the runner temp directory.
    required: true
  evidence-directory:
    description: Directory receiving scenario evidence.
    required: true

runs:
  using: composite
  steps:
    - name: Install exact runtime artifacts
      id: system
      uses: ./.github/actions/agent/install
      with:
        agent-artifact-directory: ${{ inputs.agent-artifact-directory }}
        agent-test-image-directory: ${{ inputs.agent-test-image-directory }}
        provider-artifact-directory: ${{ inputs.provider-artifact-directory }}
        protocol-artifact-directory: ${{ inputs.protocol-artifact-directory }}
        evidence-directory: ${{ inputs.evidence-directory }}/installation

    - name: Start installed Agent
      uses: ./.github/actions/agent/start
      with:
        container-name: ${{ steps.system.outputs.container-name }}

    - name: Create older generation fixture
      id: fixture-old
      uses: ./.github/actions/provider/create-fixture
      with:
        runtime-directory: ${{ inputs.runtime-directory }}
        instance-name: provider-old
        state-name: replacement
        identity: stateforge.test.replacement

    - name: Start older generation
      id: provider-old
      uses: ./.github/actions/provider/start
      with:
        container-name: ${{ steps.system.outputs.container-name }}
        fixture-path: ${{ steps.fixture-old.outputs.fixture-path }}
        instance-name: ${{ steps.fixture-old.outputs.instance-name }}
        state-name: ${{ steps.fixture-old.outputs.state-name }}
        identity: stateforge.test.replacement
        evidence-directory: ${{ inputs.evidence-directory }}/provider-old

    - name: Assert older Agent-accepted session
      uses: ./.github/actions/agent/assert-session
      with:
        container-name: ${{ steps.system.outputs.container-name }}
        provider-instance-id: ${{ steps.provider-old.outputs.provider-instance-id }}
        endpoint-generation: ${{ steps.provider-old.outputs.endpoint-generation }}
        evidence-directory: ${{ inputs.evidence-directory }}/provider-old/agent

    - name: Stop older generation
      uses: ./.github/actions/provider/stop
      with:
        container-name: ${{ steps.system.outputs.container-name }}
        unit-name: ${{ steps.provider-old.outputs.unit-name }}
        descriptor-path: ${{ steps.provider-old.outputs.descriptor-path }}
        socket-path: ${{ steps.provider-old.outputs.socket-path }}
        event-log: ${{ steps.provider-old.outputs.event-log }}
        evidence-directory: ${{ inputs.evidence-directory }}/provider-old

    - name: Create replacement fixture
      id: fixture-new
      uses: ./.github/actions/provider/create-fixture
      with:
        runtime-directory: ${{ inputs.runtime-directory }}
        instance-name: provider-new
        state-name: replacement
        identity: stateforge.test.replacement

    - name: Start replacement generation
      id: provider-new
      uses: ./.github/actions/provider/start
      with:
        container-name: ${{ steps.system.outputs.container-name }}
        fixture-path: ${{ steps.fixture-new.outputs.fixture-path }}
        instance-name: ${{ steps.fixture-new.outputs.instance-name }}
        state-name: ${{ steps.fixture-new.outputs.state-name }}
        identity: stateforge.test.replacement
        evidence-directory: ${{ inputs.evidence-directory }}/provider-new

    - name: Assert stable identity and newer generation
      shell: bash
      env:
        NEW_GENERATION: ${{ steps.provider-new.outputs.endpoint-generation }}
        NEW_ID: ${{ steps.provider-new.outputs.provider-instance-id }}
        OLD_GENERATION: ${{ steps.provider-old.outputs.endpoint-generation }}
        OLD_ID: ${{ steps.provider-old.outputs.provider-instance-id }}
      run: |
        set -euo pipefail
        if [[ "${OLD_ID}" != "${NEW_ID}" ]]; then
          echo "Replacement changed the stable Provider identity" >&2
          exit 1
        fi
        if (( NEW_GENERATION <= OLD_GENERATION )); then
          echo "Replacement did not advance endpoint generation" >&2
          exit 1
        fi

    - name: Assert replacement Agent-accepted session
      uses: ./.github/actions/agent/assert-session
      with:
        container-name: ${{ steps.system.outputs.container-name }}
        provider-instance-id: ${{ steps.provider-new.outputs.provider-instance-id }}
        endpoint-generation: ${{ steps.provider-new.outputs.endpoint-generation }}
        evidence-directory: ${{ inputs.evidence-directory }}/provider-new/agent

    - name: Stop replacement generation
      uses: ./.github/actions/provider/stop
      with:
        container-name: ${{ steps.system.outputs.container-name }}
        unit-name: ${{ steps.provider-new.outputs.unit-name }}
        descriptor-path: ${{ steps.provider-new.outputs.descriptor-path }}
        socket-path: ${{ steps.provider-new.outputs.socket-path }}
        event-log: ${{ steps.provider-new.outputs.event-log }}
        evidence-directory: ${{ inputs.evidence-directory }}/provider-new

    - name: Preserve bounded evidence and clean up
      if: ${{ always() }}
      uses: ./.github/actions/evidence/collect
      with:
        stage: same-instance-replacement
        container-name: ${{ steps.system.outputs.container-name }}
        runtime-directory: ${{ inputs.runtime-directory }}
        evidence-directory: ${{ inputs.evidence-directory }}
