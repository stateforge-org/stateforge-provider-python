name: Test concurrent installed Providers
description: Verify two distinct Provider installations can run concurrently.

inputs:
  provider-artifact-directory:
    description: Directory containing the exact Provider build.
    required: true
  protocol-artifact-directory:
    description: Directory containing the exact Protocol build.
    required: true
  runtime-directory:
    description: Scenario-owned directory under the runner temp directory.
    required: true
  evidence-directory:
    description: Directory receiving scenario evidence.
    required: true

runs:
  using: composite
  steps:
    - name: Install exact runtime artifacts
      id: environment
      uses: ./.github/actions/environment/install
      with:
        provider-artifact-directory: ${{ inputs.provider-artifact-directory }}
        protocol-artifact-directory: ${{ inputs.protocol-artifact-directory }}
        environment-directory: ${{ inputs.runtime-directory }}/environment
        evidence-directory: ${{ inputs.evidence-directory }}/installation

    - name: Create first Provider fixture
      id: fixture-a
      uses: ./.github/actions/provider/create-fixture
      with:
        runtime-directory: ${{ inputs.runtime-directory }}
        instance-name: provider-a
        identity: stateforge.test.concurrent.a

    - name: Create second Provider fixture
      id: fixture-b
      uses: ./.github/actions/provider/create-fixture
      with:
        runtime-directory: ${{ inputs.runtime-directory }}
        instance-name: provider-b
        identity: stateforge.test.concurrent.b

    - name: Start first Provider
      id: provider-a
      uses: ./.github/actions/provider/start
      with:
        python: ${{ steps.environment.outputs.python }}
        fixture-path: ${{ steps.fixture-a.outputs.fixture-path }}
        identity: stateforge.test.concurrent.a
        discovery-directory: ${{ steps.fixture-a.outputs.discovery-directory }}
        state-directory: ${{ steps.fixture-a.outputs.state-directory }}
        event-log: ${{ steps.fixture-a.outputs.event-log }}
        evidence-directory: ${{ inputs.evidence-directory }}/provider-a

    - name: Start second Provider
      id: provider-b
      uses: ./.github/actions/provider/start
      with:
        python: ${{ steps.environment.outputs.python }}
        fixture-path: ${{ steps.fixture-b.outputs.fixture-path }}
        identity: stateforge.test.concurrent.b
        discovery-directory: ${{ steps.fixture-b.outputs.discovery-directory }}
        state-directory: ${{ steps.fixture-b.outputs.state-directory }}
        event-log: ${{ steps.fixture-b.outputs.event-log }}
        evidence-directory: ${{ inputs.evidence-directory }}/provider-b

    - name: Assert distinct Provider identities
      shell: bash
      env:
        FIRST_ID: ${{ steps.provider-a.outputs.provider-instance-id }}
        SECOND_ID: ${{ steps.provider-b.outputs.provider-instance-id }}
      run: |
        if [[ "${FIRST_ID}" == "${SECOND_ID}" ]]; then
          echo "Distinct Providers reused one installation identity" >&2
          exit 1
        fi

    - name: Assert first Manifest
      uses: ./.github/actions/sfp/assert-manifest
      with:
        python: ${{ steps.environment.outputs.python }}
        descriptor-path: ${{ steps.provider-a.outputs.descriptor-path }}
        identity: stateforge.test.concurrent.a
        evidence-directory: ${{ inputs.evidence-directory }}/provider-a/sfp

    - name: Assert second Manifest
      uses: ./.github/actions/sfp/assert-manifest
      with:
        python: ${{ steps.environment.outputs.python }}
        descriptor-path: ${{ steps.provider-b.outputs.descriptor-path }}
        identity: stateforge.test.concurrent.b
        evidence-directory: ${{ inputs.evidence-directory }}/provider-b/sfp

    - name: Stop first Provider
      uses: ./.github/actions/provider/stop
      with:
        pid: ${{ steps.provider-a.outputs.pid }}
        descriptor-path: ${{ steps.provider-a.outputs.descriptor-path }}
        socket-path: ${{ steps.provider-a.outputs.socket-path }}
        event-log: ${{ steps.fixture-a.outputs.event-log }}
        evidence-directory: ${{ inputs.evidence-directory }}/provider-a

    - name: Stop second Provider
      uses: ./.github/actions/provider/stop
      with:
        pid: ${{ steps.provider-b.outputs.pid }}
        descriptor-path: ${{ steps.provider-b.outputs.descriptor-path }}
        socket-path: ${{ steps.provider-b.outputs.socket-path }}
        event-log: ${{ steps.fixture-b.outputs.event-log }}
        evidence-directory: ${{ inputs.evidence-directory }}/provider-b

    - name: Preserve bounded evidence and clean up
      if: ${{ always() }}
      uses: ./.github/actions/evidence/collect
      with:
        stage: concurrent-providers
        runtime-directory: ${{ inputs.runtime-directory }}
        evidence-directory: ${{ inputs.evidence-directory }}
