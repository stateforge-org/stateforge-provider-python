name: Assert SFP Bootstrap
description: Negotiate SFP 1.0 against one installed Provider endpoint.

inputs:
  python:
    description: Isolated Python containing exact Provider and Protocol artifacts.
    required: true
  descriptor-path:
    description: Provider endpoint descriptor.
    required: true
  evidence-directory:
    description: Directory receiving Bootstrap evidence.
    required: true

runs:
  using: composite
  steps:
    - name: Negotiate the installed endpoint
      shell: bash
      env:
        DESCRIPTOR_PATH: ${{ inputs.descriptor-path }}
        EVIDENCE_DIRECTORY: ${{ inputs.evidence-directory }}
        ISOLATED_PYTHON: ${{ inputs.python }}
        PROBE: ${{ github.workspace }}/.github/actions/sfp/probe.py
      run: |
        set -euo pipefail
        mkdir -p "${EVIDENCE_DIRECTORY}"
        output="${GITHUB_WORKSPACE}/${EVIDENCE_DIRECTORY}/bootstrap.json"
        cd "${RUNNER_TEMP}"
        unset PYTHONPATH PYTHONHOME
        "${ISOLATED_PYTHON}" -I "${PROBE}" bootstrap \
          --descriptor "${DESCRIPTOR_PATH}" \
          --output "${output}"
