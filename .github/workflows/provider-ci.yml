name: Provider CI

on:
  pull_request:
    branches:
      - main
      - mvp/implementation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provider:
    name: Build and verify Provider
    uses: ./.github/workflows/provider-build-and-verify.yml
    with:
      artifact-name: stateforge-provider-pr-${{ github.run_id }}-${{ github.run_attempt }}
      protocol-ref: mvp/implementation
      scenario-tier: full
      retention-days: 7
