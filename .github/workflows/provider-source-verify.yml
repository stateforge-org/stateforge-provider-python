name: Provider / Source verification

on:
  workflow_call:
    inputs:
      evidence-name:
        description: Name used to upload source-verification evidence.
        required: false
        type: string
        default: stateforge-provider-source-evidence
      retention-days:
        description: Number of days to retain source-verification evidence.
        required: false
        type: number
        default: 14

permissions:
  contents: read

jobs:
  verify:
    name: Validate source, automation, tests, typing, and docs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check \
            --group dev \
            --group docs \
            .

      - name: Install actionlint
        shell: bash
        env:
          ACTIONLINT_VERSION: v1.7.12
        run: |
          actionlint_directory="${RUNNER_TEMP}/actionlint"
          mkdir -p "${actionlint_directory}"
          GOBIN="${actionlint_directory}" go install \
            "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
          echo "${actionlint_directory}" >> "${GITHUB_PATH}"

      - name: Validate workflow metadata
        shell: bash
        run: actionlint -color

      - name: Audit GitHub Actions security
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          inputs: .
          collect: all
          online-audits: false
          persona: auditor
          min-severity: medium
          version: v1.30.1
          token: unused-offline
          advanced-security: false
          annotations: true

      - name: Run repository quality gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/source
          {
            python -m ruff format --check .
            python -m ruff check .
            python -m mypy src
            python -m pytest
            python -m mkdocs build --strict
          } 2>&1 | tee evidence/source/quality.log

      - name: Upload source-verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.evidence-name }}
          path: evidence/source
          if-no-files-found: warn
          retention-days: ${{ inputs.retention-days }}
