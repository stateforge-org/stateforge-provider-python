name: Provider / Installed package verification

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Runtime bundle produced by provider-build.yml.
        required: true
        type: string
      evidence-prefix:
        description: Prefix for per-platform evidence artifacts.
        required: false
        type: string
        default: stateforge-provider-installed
      retention-days:
        description: Number of days to retain installed-package evidence.
        required: false
        type: number
        default: 14

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
          - windows-2022
        python:
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - name: Check out verification automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Download exact runtime bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/stateforge-provider-bundle

      - name: Verify installed artifacts
        uses: ./.github/actions/package/verify-installed
        with:
          provider-artifact-directory: ${{ runner.temp }}/stateforge-provider-bundle/provider
          protocol-artifact-directory: ${{ runner.temp }}/stateforge-provider-bundle/protocol
          environment-directory: ${{ runner.temp }}/stateforge-provider-installed
          evidence-directory: evidence/installed

      - name: Upload installed-package evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.evidence-prefix }}-${{ matrix.os }}-py${{ matrix.python }}
          path: evidence/installed
          if-no-files-found: warn
          retention-days: ${{ inputs.retention-days }}
